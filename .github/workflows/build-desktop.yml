name: Build Desktop Apps

# این ورک‌فلو به‌صورت خودکار روی هر سه پلتفرم دسکتاپ (ویندوز، مک، لینوکس) بیلد می‌گیرد.
# هر پلتفرم روی رانر مخصوص خودش اجرا می‌شود چون Flutter امکان کراس-کامپایل مستقیم ندارد
# (مثلاً نمی‌شود از لینوکس برای ویندوز بیلد گرفت) - برای همین سه Job جدا داریم.
#
# روی تگ‌های نسخه (v*)، خروجی‌ها به‌صورت خودکار به GitHub Release هم آپلود می‌شوند.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

# اگر پشت سر هم چند بار پوش شود، فقط آخرین اجرا کامل می‌شود و اجراهای قبلی
# روی همان شاخه/تگ لغو می‌شوند - صرفه‌جویی در سهم دقیقه‌ی Actions.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# نسخه‌ی Flutter را در یک جا پین می‌کنیم تا هر سه جاب دقیقاً از یک نسخه استفاده کنند.
# در صورت نیاز به ارتقا، فقط این مقدار را تغییر بده.
env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: فعال‌سازی پشتیبانی ویندوز
        run: flutter config --enable-windows-desktop

      - name: نصب وابستگی‌های پروژه
        run: flutter pub get

      - name: بیلد نسخه‌ی ریلیز ویندوز
        run: flutter build windows --release

      - name: فشرده‌سازی خروجی ویندوز
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../windows-build.zip *
        shell: bash

      - name: بارگذاری خروجی به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: فعال‌سازی پشتیبانی مک
        run: flutter config --enable-macos-desktop

      - name: نصب وابستگی‌های پروژه
        run: flutter pub get

      - name: بیلد نسخه‌ی ریلیز مک
        run: flutter build macos --release

      - name: فشرده‌سازی خروجی مک
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../macos-build.zip *.app

      - name: بارگذاری خروجی به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: macos-build.zip
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پیش‌نیازهای سیستمی لینوکس
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: فعال‌سازی پشتیبانی لینوکس
        run: flutter config --enable-linux-desktop

      - name: نصب وابستگی‌های پروژه
        run: flutter pub get

      - name: بیلد نسخه‌ی ریلیز لینوکس
        run: flutter build linux --release

      - name: فشرده‌سازی خروجی لینوکس
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../linux-build.tar.gz *

      - name: بارگذاری خروجی به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: linux-build.tar.gz
          retention-days: 30

  # این جاب فقط روی تگ‌های نسخه (v*) اجرا می‌شود و منتظر می‌ماند تا هر سه جاب
  # بیلد موفق شوند، سپس یک GitHub Release می‌سازد و آرتیفکت‌ها را به آن پیوست می‌کند.
  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: دانلود همه‌ی آرتیفکت‌ها
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: نمایش فایل‌های دانلود شده (برای دیباگ)
        run: ls -la artifacts/**/*

      - name: ساخت GitHub Release و آپلود فایل‌ها
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/windows-build.zip
            artifacts/macos-build/macos-build.zip
            artifacts/linux-build/linux-build.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
