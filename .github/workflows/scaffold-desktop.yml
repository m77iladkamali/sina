name: Scaffold Desktop Platforms

# این ورک‌فلو یک‌بار اجرا می‌شود تا فولدرهای native ویندوز/مک/لینوکس
# (windows/, macos/, linux/) را که flutter create می‌سازد، بدون نیاز به
# نصب Flutter روی سیستم شخصی، مستقیم داخل خود گیت‌هاب تولید و commit کند.
# بعد از اجرای موفق این ورک‌فلو، دیگر لازم نیست دوباره اجرا شود -
# فقط زمانی که بخواهید از صفر یک پلتفرم را دوباره بسازید لازم می‌شود.
#
# نکته: اگر شاخه‌ی main شما branch protection دارد، push مستقیم شکست می‌خورد.
# در آن صورت باید یا موقتاً protection را غیرفعال کنید، یا این ورک‌فلو را
# به‌سمت ساخت PR تغییر دهید (بخش pull_request در انتها را باز کنید).

on:
  workflow_dispatch: {}

# جلوگیری از اجرای هم‌زمان چند نمونه از این ورک‌فلو - چون هر دو سعی می‌کنند
# روی یک شاخه push کنند و دومی با non-fast-forward شکست می‌خورد.
concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب پیش‌نیازهای لینوکس (برای اعتبارسنجی بیلد در انتها)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: فعال‌سازی پشتیبانی هر سه پلتفرم دسکتاپ
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      - name: ذخیره‌ی وضعیت pubspec.yaml قبل از scaffold
        run: cp pubspec.yaml pubspec.yaml.before

      - name: تولید فولدرهای native دسکتاپ (بدون تغییر کد Dart موجود)
        run: flutter create --platforms=windows,macos,linux .

      - name: بررسی فایل‌های تولیدشده و تغییرات
        run: |
          echo "=== فولدرهای ساخته‌شده ==="
          ls -d windows macos linux 2>/dev/null || echo "هیچ فولدری ساخته نشد!"
          echo ""
          echo "=== تغییرات pubspec.yaml (اگر وجود دارد) ==="
          diff pubspec.yaml.before pubspec.yaml || echo "(pubspec.yaml تغییر کرده است)"
          rm pubspec.yaml.before
          echo ""
          echo "=== وضعیت git ==="
          git status --short

      - name: نصب وابستگی‌ها برای اعتبارسنجی
        run: flutter pub get

      - name: اعتبارسنجی بیلد لینوکس (تضمین سالم بودن scaffold)
        run: flutter build linux --release

      - name: کامیت و پوش تمام تغییرات (فولدرها + متادیتا + pubspec)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # همه‌ی مواردی که flutter create ممکن است ایجاد یا تغییر داده باشد:
          # - فولدرهای native هر سه پلتفرم
          # - .metadata (لیست پلتفرم‌های فعال پروژه)
          # - pubspec.yaml (گاهی توسط flutter create ویرایش می‌شود)
          git add windows macos linux .metadata pubspec.yaml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "تغییری برای کامیت نیست - احتمالاً فولدرها از قبل وجود داشته‌اند."
          else
            # از دو تا -m استفاده می‌کنیم تا پاراگراف اول و دوم کامیت جدا باشند،
            # بدون این‌که نیاز به رشته‌ی چندخطی داخل YAML باشد (که به‌راحتی
            # می‌تواند indent block scalar را خراب کند).
            git commit \
              -m "Scaffold desktop platform folders (windows, macos, linux)" \
              -m "Generated by GitHub Actions using Flutter ${{ env.FLUTTER_VERSION }}."
            git push
            echo "✓ کامیت با موفقیت push شد."
          fi

      # === اختیاری: اگر branch protection مانع push مستقیم است ===
      # مراحل بالا را حذف کنید و به‌جای آن از این استفاده کنید تا PR ساخته شود:
      #
      # - name: ساخت Pull Request به‌جای push مستقیم
      #   uses: peter-evans/create-pull-request@v6
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     commit-message: "Scaffold desktop platform folders"
      #     title: "Scaffold desktop platforms (windows, macos, linux)"
      #     body: "Generated by workflow_dispatch on scaffold-desktop-platforms."
      #     branch: scaffold-desktop-platforms
      #     add-paths: |
      #       windows/**
      #       macos/**
      #       linux/**
      #       .metadata
      #       pubspec.yaml
