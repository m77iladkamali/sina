name: Scaffold Desktop Platforms
 
# این ورک‌فلو یک‌بار اجرا می‌شود تا فولدرهای native ویندوز/مک/لینوکس
# (windows/, macos/, linux/) را که flutter create می‌سازد، بدون نیاز به
# نصب Flutter روی سیستم شخصی، مستقیم داخل خود گیت‌هاب تولید و commit کند.
# بعد از اجرای موفق این ورک‌فلو، دیگر لازم نیست دوباره اجرا شود -
# فقط زمانی که بخواهید از صفر یک پلتفرم را دوباره بسازید لازم می‌شود.
 
on:
  workflow_dispatch: {} # فقط دستی از تب Actions اجرا می‌شود
 
permissions:
  contents: write # برای commit و push خودکار به مخزن لازم است
 
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: نصب Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
 
      - name: فعال‌سازی پشتیبانی هر سه پلتفرم دسکتاپ
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop
 
      - name: تولید فولدرهای native دسکتاپ (بدون تغییر کد Dart موجود)
        run: flutter create --platforms=windows,macos,linux .
 
      - name: بررسی فایل‌های تولیدشده
        run: |
          echo "فولدرهای ساخته‌شده:"
          ls -d windows macos linux 2>/dev/null || true
 
      - name: کامیت و پوش فولدرهای تولیدشده
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windows macos linux
          git diff --cached --quiet && echo "تغییری برای کامیت نیست" || git commit -m "Scaffold desktop platform folders (windows, macos, linux)"
          git push
 
