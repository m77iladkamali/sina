name: sina
description: "مشاور همراه سینا"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  face_detection_tflite: ^5.0.6
  fl_chart: ^0.70.2
  permission_handler: ^12.0.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  meta: 1.17.0   # حل تعارض بین face_detection_tflite و flutter_test

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/sina1.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/sina.png

  fonts:
    - family: Far_Homa
      fonts:
        - asset: assets/fonts/Far_Homa.ttf
