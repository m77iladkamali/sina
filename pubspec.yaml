name: sina
description: "مشاور همراه سینا"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # دوربین
  camera: ^0.11.0

  # تشخیص چهره با TFLite (نسخه جدید با ۴۶۸ نقطه)
  face_detection_tflite: ^5.0.6

  # پردازش سیگنال (FFT, فیلتر)
  open_dspc: ^0.0.3

  # تبدیل YUV به RGB با سرعت بالا (C++ FFI)
  yuv_ffi: ^0.1.1

  # نمودار لحظه‌ای
  fl_chart: ^0.70.2

  # مجوزها
  permission_handler: ^12.0.2

  # مدیریت وضعیت
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7برای آیکون‌های زیبا

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/sina1.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/sina.png

  fonts:
    - family: Far_Homa
      fonts:
        - asset: assets/fonts/Far_Homa.ttf
